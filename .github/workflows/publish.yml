name: Publish to NPM

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC) and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org/'
      # Trusted publishing needs npm 11.5.1 or newer; Node 22 ships npm 10.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run validate
      - run: npm test
      - name: Verify Version Match
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          GIT_TAG=${GITHUB_REF#refs/tags/v}
          if [ "$PKG_VERSION" != "$GIT_TAG" ]; then
            echo "Error: package.json version ($PKG_VERSION) does not match git tag ($GIT_TAG)"
            exit 1
          fi
      # Authenticates with npm trusted publishing when it is configured for this
      # repo on npmjs.com (no token needed). Otherwise it falls back to the
      # NPM_TOKEN secret, which must be a granular token with "Bypass 2FA" enabled.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
