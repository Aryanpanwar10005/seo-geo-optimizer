<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-label="Terminal running npx seo-geo-optimizer: detects Claude Code, installs the skill into .agents/skills and .claude/skills, then suggests asking the agent to run seo-geo-optimizer">
  <rect width="800" height="400" rx="10" fill="#1e1e1e" />
  <circle cx="20" cy="20" r="6" fill="#ff5f56" />
  <circle cx="40" cy="20" r="6" fill="#ffbd2e" />
  <circle cx="60" cy="20" r="6" fill="#27c93f" />
  <rect x="0" y="40" width="800" height="360" fill="#0b0b0b" />

  <text x="20" y="72" font-family="monospace" font-size="16" fill="#27c93f">➜</text>
  <text x="40" y="72" font-family="monospace" font-size="16" fill="#4ea5ff">~/my-site</text>
  <text x="140" y="72" font-family="monospace" font-size="16" fill="#ffffff">npx seo-geo-optimizer</text>

  <text x="20" y="104" font-family="monospace" font-size="15" fill="#4ea5ff">  SEO &amp; GEO OPTIMIZER  v2.1.0</text>
  <text x="20" y="132" font-family="monospace" font-size="15" fill="#a0a0a0">ℹ  Detected: Claude Code</text>

  <text x="20" y="164" font-family="monospace" font-size="15" fill="#ffffff">Installing into this project</text>
  <text x="20" y="190" font-family="monospace" font-size="15" fill="#27c93f">✔  Installed .agents/skills/seo-geo-optimizer</text>
  <text x="20" y="212" font-family="monospace" font-size="13" fill="#8a8a8a">   for Codex, Cursor, GitHub Copilot, Antigravity, Gemini CLI, Windsurf, Zed, Junie, Replit</text>
  <text x="20" y="240" font-family="monospace" font-size="15" fill="#27c93f">✔  Installed .claude/skills/seo-geo-optimizer</text>
  <text x="20" y="262" font-family="monospace" font-size="13" fill="#8a8a8a">   for Claude Code</text>

  <text x="20" y="300" font-family="monospace" font-size="15" fill="#ffbd2e">Next: start a new chat in your tool, then ask:</text>
  <text x="20" y="326" font-family="monospace" font-size="15" fill="#ffffff">  "run seo-geo-optimizer"  — starts the guided audit</text>
  <text x="20" y="352" font-family="monospace" font-size="13" fill="#8a8a8a">  Shared files like CLAUDE.md and AGENTS.md are never edited.</text>
</svg>
